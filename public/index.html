<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino Clip Factory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #020617;
      --surface:   #0f172a;
      --surface2:  #1e293b;
      --border:    rgba(212,175,55,0.18);
      --gold:      #d4af37;
      --gold-glow: rgba(212,175,55,0.35);
      --text:      #f8fafc;
      --muted:     #94a3b8;
      --red:       #ef4444;
      --amber:     #f59e0b;
      --green:     #22c55e;
      --radius:    12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Fira Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(2,6,23,0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--gold), #a0762a);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-title {
      font-family: 'Fira Code', monospace;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.04em;
    }

    .logo-subtitle {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      gap: 8px;
      padding: 12px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .stats-bar::-webkit-scrollbar { display: none; }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .stat-chip .val {
      font-family: 'Fira Code', monospace;
      font-weight: 600;
      color: var(--gold);
    }

    .stat-chip .lbl { color: var(--muted); }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 24px;
      flex-wrap: wrap;
    }

    .btn-scan {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: var(--radius);
      padding: 10px 20px;
      font-family: 'Fira Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 150ms, box-shadow 150ms;
    }
    .btn-scan:hover { opacity: 0.88; box-shadow: 0 0 18px var(--gold-glow); }
    .btn-scan:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-scan svg { transition: transform 400ms; }
    .btn-scan.spinning svg { animation: spin 1s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .filter-tabs {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .filter-tab {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--muted);
      transition: background 150ms, color 150ms;
    }
    .filter-tab.active {
      background: var(--surface2);
      color: var(--text);
    }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      cursor: pointer;
      user-select: none;
    }
    .toggle-wrap span { font-size: 13px; color: var(--muted); white-space: nowrap; }

    .toggle {
      width: 36px;
      height: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      position: relative;
      transition: background 200ms;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--gold); border-color: var(--gold); }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 200ms;
    }
    .toggle.on::after { transform: translateX(16px); }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      padding: 0 24px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 200ms, transform 200ms, box-shadow 200ms;
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      border-color: rgba(212,175,55,0.45);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .card.clip-worthy {
      border-color: rgba(212,175,55,0.5);
    }
    .card.clip-worthy::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(212,175,55,0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .score-badge {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: 'Fira Code', monospace;
      font-size: 18px;
      font-weight: 700;
      border: 2px solid;
      position: relative;
    }

    .score-1, .score-2, .score-3 {
      background: rgba(239,68,68,0.12);
      border-color: var(--red);
      color: var(--red);
    }
    .score-4, .score-5, .score-6 {
      background: rgba(245,158,11,0.12);
      border-color: var(--amber);
      color: var(--amber);
    }
    .score-7 {
      background: rgba(34,197,94,0.12);
      border-color: var(--green);
      color: var(--green);
    }
    .score-8, .score-9, .score-10 {
      background: rgba(212,175,55,0.15);
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 14px var(--gold-glow);
    }

    .card-meta { flex: 1; min-width: 0; }

    .streamer-name {
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .clip-stamp {
      font-family: 'Fira Code', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 1px 5px;
    }

    .stream-title {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.45;
    }

    .card-stats {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .viewers-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .score-bar-wrap {
      flex: 1;
      height: 4px;
      background: var(--surface2);
      border-radius: 999px;
      overflow: hidden;
    }
    .score-bar {
      height: 100%;
      border-radius: 999px;
      transition: width 600ms ease;
    }

    .highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .hl-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface2);
      border: 1px solid rgba(212,175,55,0.25);
      color: var(--gold);
      font-family: 'Fira Code', monospace;
    }

    .reason {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      font-style: italic;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .category-tag {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .kick-link {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--gold);
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 6px;
      transition: background 150ms, border-color 150ms;
      cursor: pointer;
    }
    .kick-link:hover {
      background: rgba(212,175,55,0.12);
      border-color: var(--gold);
    }

    /* ── Skeleton ── */
    .skeleton {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .skel {
      background: linear-gradient(90deg, var(--surface2) 25%, #2a3a52 50%, var(--surface2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Empty state ── */
    .empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 80px 24px;
      color: var(--muted);
      text-align: center;
    }
    .empty svg { opacity: 0.3; }
    .empty p { font-size: 14px; }

    /* ── Error banner ── */
    .error-banner {
      margin: 0 24px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      color: #fca5a5;
      display: none;
    }
    .error-banner.show { display: block; margin-bottom: 16px; }

    @media (max-width: 600px) {
      header { padding: 0 16px; }
      .stats-bar, .controls { padding-left: 16px; padding-right: 16px; }
      .grid { padding: 0 16px; }
      .logo-subtitle { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .skel { animation: none; }
      .btn-scan.spinning svg { animation: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    </div>
    <div>
      <div class="logo-title">Casino Clip Factory</div>
      <div class="logo-subtitle">Kick Big Win Monitor</div>
    </div>
  </div>

  <div class="header-right">
    <div class="stat-chip" id="chip-last">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span class="lbl">Last scan</span>
      <span class="val" id="last-time">—</span>
    </div>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-chip">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    <span class="lbl">Scanned</span>
    <span class="val" id="stat-scanned">—</span>
  </div>
  <div class="stat-chip">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <span class="lbl">Big wins</span>
    <span class="val" id="stat-bigwins">—</span>
  </div>
  <div class="stat-chip">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
    <span class="lbl">Clip-worthy</span>
    <span class="val" id="stat-clips">—</span>
  </div>
  <div class="stat-chip">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    <span class="lbl">Threshold</span>
    <span class="val" id="stat-threshold">7</span>
  </div>
</div>

<div class="controls">
  <button class="btn-scan" id="btn-scan">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    Scan Now
  </button>

  <div class="filter-tabs">
    <button class="filter-tab active" data-filter="all">All streams</button>
    <button class="filter-tab" data-filter="bigwin">Big wins</button>
    <button class="filter-tab" data-filter="clip">Clip-worthy</button>
  </div>

  <label class="toggle-wrap" for="auto-toggle">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>Auto (5 min)</span>
    <div class="toggle" id="auto-toggle"></div>
  </label>
</div>

<div class="error-banner" id="error-banner"></div>

<div class="grid" id="grid">
  <div class="empty">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <p>Press <strong>Scan Now</strong> to fetch and analyze live casino streams.</p>
  </div>
</div>

<script>
  const THRESHOLD = 7;
  let currentData = [];
  let currentFilter = 'all';
  let autoInterval = null;

  const grid        = document.getElementById('grid');
  const btnScan     = document.getElementById('btn-scan');
  const errorBanner = document.getElementById('error-banner');
  const autoToggle  = document.getElementById('auto-toggle');
  const lastTime    = document.getElementById('last-time');

  // ── Filter tabs
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      renderCards(currentData);
    });
  });

  // ── Auto-refresh toggle
  autoToggle.parentElement.addEventListener('click', () => {
    const on = autoToggle.classList.toggle('on');
    if (on) {
      autoInterval = setInterval(() => runScan(), 5 * 60 * 1000);
    } else {
      clearInterval(autoInterval);
      autoInterval = null;
    }
  });

  // ── Scan button
  btnScan.addEventListener('click', runScan);

  async function runScan() {
    btnScan.disabled = true;
    btnScan.classList.add('spinning');
    hideError();
    showSkeletons(6);

    try {
      const res = await fetch('/api/analyze/scan?limit=20&threshold=' + THRESHOLD);
      if (!res.ok) throw new Error('Server error ' + res.status);
      const data = await res.json();
      currentData = data.all ?? [];
      updateStats(data);
      renderCards(currentData);
      lastTime.textContent = timeAgo(new Date());
    } catch (err) {
      showError('Scan failed: ' + err.message + '. Make sure ANTHROPIC_API_KEY is set and Kick is reachable.');
      if (currentData.length === 0) renderEmpty();
    } finally {
      btnScan.disabled = false;
      btnScan.classList.remove('spinning');
    }
  }

  function updateStats(data) {
    document.getElementById('stat-scanned').textContent  = data.scanned   ?? '—';
    document.getElementById('stat-bigwins').textContent  = data.bigWinsFound ?? '—';
    document.getElementById('stat-threshold').textContent = data.threshold ?? THRESHOLD;
    const clips = (data.all ?? []).filter(r => r.analysis?.clipWorthy).length;
    document.getElementById('stat-clips').textContent = clips;
  }

  function filterData(data) {
    if (currentFilter === 'bigwin')  return data.filter(r => (r.analysis?.score ?? 0) >= THRESHOLD);
    if (currentFilter === 'clip')    return data.filter(r => r.analysis?.clipWorthy);
    return data;
  }

  function renderCards(data) {
    const filtered = filterData(data);
    if (filtered.length === 0) { renderEmpty(); return; }
    grid.innerHTML = filtered.map(cardHTML).join('');
  }

  function cardHTML(result) {
    const { meta, analysis } = result;
    if (!meta || !analysis) return '';

    const score    = analysis.score ?? 0;
    const title    = escHtml(meta.title ?? 'Untitled');
    const streamer = escHtml(meta.streamer ?? 'Unknown');
    const viewers  = formatNum(meta.viewers ?? 0);
    const reason   = escHtml(analysis.reason ?? '');
    const clips    = analysis.clipWorthy;
    const url      = escHtml(meta.streamUrl ?? '#');
    const category = escHtml(meta.category ?? '');
    const barColor = score >= 8 ? 'var(--gold)' : score >= 7 ? 'var(--green)' : score >= 4 ? 'var(--amber)' : 'var(--red)';
    const highlights = (analysis.highlights ?? []).slice(0, 4);

    return `
    <div class="card${clips ? ' clip-worthy' : ''}">
      <div class="card-header">
        <div class="score-badge score-${Math.min(score, 10)}">${score}</div>
        <div class="card-meta">
          <div class="streamer-name">
            ${streamer}
            ${clips ? '<span class="clip-stamp">clip worthy</span>' : ''}
          </div>
          <div class="stream-title">${title}</div>
        </div>
      </div>

      <div class="card-stats">
        <div class="viewers-chip">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          ${viewers}
        </div>
        <div class="score-bar-wrap">
          <div class="score-bar" style="width:${score * 10}%; background:${barColor};"></div>
        </div>
      </div>

      ${highlights.length ? `<div class="highlights">${highlights.map(h => `<span class="hl-badge">${escHtml(h)}</span>`).join('')}</div>` : ''}

      ${reason ? `<div class="reason">"${reason}"</div>` : ''}

      <div class="card-footer">
        <div class="category-tag">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          ${category}
        </div>
        <a href="${url}" target="_blank" rel="noopener" class="kick-link">
          Watch
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>`;
  }

  function showSkeletons(n) {
    grid.innerHTML = Array.from({ length: n }, () => `
      <div class="skeleton">
        <div style="display:flex;gap:12px;align-items:center">
          <div class="skel" style="width:48px;height:48px;border-radius:50%;flex-shrink:0"></div>
          <div style="flex:1;display:flex;flex-direction:column;gap:8px">
            <div class="skel" style="height:14px;width:55%"></div>
            <div class="skel" style="height:12px;width:80%"></div>
          </div>
        </div>
        <div class="skel" style="height:4px;width:100%;border-radius:999px"></div>
        <div style="display:flex;gap:6px">
          <div class="skel" style="height:22px;width:70px;border-radius:999px"></div>
          <div class="skel" style="height:22px;width:90px;border-radius:999px"></div>
        </div>
        <div class="skel" style="height:36px;width:100%"></div>
      </div>
    `).join('');
  }

  function renderEmpty() {
    grid.innerHTML = `
      <div class="empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <p>No streams match the current filter.</p>
      </div>`;
  }

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.classList.add('show');
  }
  function hideError() { errorBanner.classList.remove('show'); }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatNum(n) {
    if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
    return String(n);
  }

  function timeAgo(date) {
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // Load last scan results on page open
  (async () => {
    try {
      const res = await fetch('/api/latest');
      if (!res.ok) return;
      const data = await res.json();
      currentData = data.all ?? [];
      updateStats(data);
      if (currentData.length > 0) {
        renderCards(currentData);
        if (data.scannedAt) lastTime.textContent = timeAgo(new Date(data.scannedAt));
      }
    } catch {}
  })();
</script>
</body>
</html>
